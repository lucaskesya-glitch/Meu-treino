<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Meu treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7FC;--surface:#FFFFFF;--surface2:#F1EAF9;--ink:#2F2440;--muted:#736887;--line:#E7DFF1;
  --accent:#7B58BD;--accent-2:#A58BDB;--accent-soft:#EEE6FA;--pink:#F9E1EB;--pink-strong:#E6A1C1;
  --ok:#3F8F72;--warn:#B8683F;--on-accent:#FFFFFF;
  --serif:'Fraunces','Iowan Old Style',Georgia,serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:66px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1624;--surface:#241D30;--surface2:#2E2641;--ink:#F2ECF8;--muted:#AA9FBA;--line:#3A3050;
    --accent:#B99DEB;--accent-2:#8F72C8;--accent-soft:#372C4E;--pink:#46293B;--pink-strong:#E3A3C4;
    --ok:#7CC7A9;--warn:#E3A07A;--on-accent:#1B1624;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1624;--surface:#241D30;--surface2:#2E2641;--ink:#F2ECF8;--muted:#AA9FBA;--line:#3A3050;
  --accent:#B99DEB;--accent-2:#8F72C8;--accent-soft:#372C4E;--pink:#46293B;--pink-strong:#E3A3C4;
  --ok:#7CC7A9;--warn:#E3A07A;--on-accent:#1B1624;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:8px}
img{max-width:100%}
#app{max-width:520px;margin:0 auto;padding:14px 18px calc(var(--nav-h) + 30px)}
h1,h2,h3{margin:0;font-weight:500}
h1{font-family:var(--serif);font-size:1.9rem;line-height:1.1;letter-spacing:-.01em}
h2{font-family:var(--serif);font-size:1.45rem;line-height:1.15}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.tiny{font-size:.78rem}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;border:0;font-weight:700;font-size:1rem;background:var(--surface2);color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.pink{background:var(--pink);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--accent);padding:0 12px}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn.big{min-height:60px;font-size:1.08rem;border-radius:18px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface2);display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn svg{width:22px;height:22px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:600;font-size:.92rem;min-height:42px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.like{background:var(--accent-soft);border-color:var(--accent-2);color:var(--accent)}
.chip.avoid{background:var(--pink);border-color:var(--pink-strong);text-decoration:line-through;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;min-height:42px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}

/* inputs */
label.f{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
.inp{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;font-size:1.05rem}
.inp:focus{border-color:var(--accent-2);outline:none}
textarea.inp{min-height:88px;resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 18px}
.hello{color:var(--muted);font-weight:600}

/* hero */
.hero{background:linear-gradient(160deg,var(--accent-soft),var(--pink));border-radius:28px;padding:20px 18px 18px;position:relative}
.hero-top{display:flex;gap:10px;align-items:flex-start}
.hero .kicker{font-weight:700;color:var(--accent);font-size:.9rem}
.hero .day-name{font-family:var(--serif);font-size:2.05rem;line-height:1.05;margin:4px 0 8px;font-weight:500}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:5px 11px;font-weight:700;font-size:.85rem}
.hero-map{width:108px;flex:none;margin-top:-4px}
.ex-mini{list-style:none;margin:14px 0 16px;padding:0;background:var(--surface);border-radius:18px}
.ex-mini li{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:.95rem}
.ex-mini li:first-child{border-top:0}
.ex-mini .sr{color:var(--muted);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.ex-mini .lower::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}

/* blocks */
.block{margin-top:22px}
.block>h3{margin-bottom:10px}
.panel{background:var(--surface);border-radius:20px;padding:16px}
.list{background:var(--surface);border-radius:20px;overflow:hidden}
.list>.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list>.li:first-child{border-top:0}
.li .t{font-weight:700}
.li .s{color:var(--muted);font-size:.86rem}
.chev{color:var(--muted);flex:none}
.week-dots{display:flex;gap:8px;margin-top:8px}
.week-dots span{width:30px;height:10px;border-radius:6px;background:var(--surface2)}
.week-dots span.on{background:var(--accent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border-radius:20px;padding:14px 16px}
.kpi .v{font-family:var(--serif);font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:.85rem;font-weight:600}
.up{color:var(--ok);font-weight:700}
.down{color:var(--warn);font-weight:700}
.note{background:var(--pink);border-radius:16px;padding:12px 14px;font-size:.92rem}
.note.lilac{background:var(--accent-soft)}
.letter{width:40px;height:40px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-family:var(--serif);font-size:1.25rem;display:grid;place-items:center;flex:none}
.tag{font-size:.75rem;font-weight:800;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:3px 9px}

/* logger */
.log-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.ex-nav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.ex-nav::-webkit-scrollbar{display:none}
.ex-nav button{min-width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;flex:none}
.ex-nav button.cur{border-color:var(--accent);color:var(--accent)}
.ex-nav button.fin{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.ex-card{background:var(--surface);border-radius:24px;padding:18px 16px}
.ex-card h2{font-size:1.6rem}
.target{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.target .pill{background:var(--surface2)}
.sug{background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}
.sug.up{color:var(--ink)}
.sets-head,.set{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;align-items:center}
.sets-head.nokg,.set.nokg{grid-template-columns:30px 1fr 52px}
.sets-head{color:var(--muted);font-size:.8rem;font-weight:700;padding:0 2px 6px}
.set{padding:6px 0;border-top:1px solid var(--line)}
.set-n{font-weight:800;color:var(--muted);text-align:center}
.stepper{display:flex;align-items:center;background:var(--surface2);border-radius:14px;height:52px}
.stepper button{width:38px;height:52px;border:0;background:transparent;font-size:1.35rem;font-weight:600;color:var(--accent);flex:none}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;padding:0}
.stepper input:focus{outline:none}
.check{width:52px;height:52px;border-radius:16px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.check svg{width:24px;height:24px}
.set.done .check{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.set.done .stepper{background:var(--accent-soft)}
.log-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

/* rest bar */
.rest{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:30;padding:0 12px 8px}
.rest-in{max-width:496px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.rest-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--pink-strong);transition:width .25s linear}
.rest-time{font-family:var(--serif);font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:64px}
.rest-in button{background:rgba(255,255,255,.14);color:inherit;border:0;border-radius:12px;min-height:44px;padding:0 12px;font-weight:700}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted);position:relative}
.nav svg{width:24px;height:24px}
.nav button.on{color:var(--accent)}
.nav .dot{position:absolute;top:10px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--pink-strong)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(40,28,60,.38)}
.sheet{position:relative;width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{margin-bottom:6px}
.steps{padding-left:22px;margin:6px 0 0}
.steps li{margin:6px 0}
.errs{padding-left:20px;margin:6px 0 0}
.errs li{margin:5px 0}
.mmap{width:100%;max-width:260px;display:block;margin:6px auto}
.mm-l{font-size:9px;fill:var(--muted);font-family:var(--sans);font-weight:600}

/* charts */
.chart{width:100%;height:auto;display:block}
.ct{font-size:10px;fill:var(--muted);font-family:var(--sans);font-weight:600}
.empty-chart{color:var(--muted);font-size:.9rem;padding:18px 0;text-align:center}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid button{padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:var(--surface2);position:relative}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.45);color:#fff;font-size:.72rem;font-weight:700;border-radius:8px;padding:2px 6px}

/* chat */
.msgs{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;font-size:.97rem;line-height:1.45;white-space:normal;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.msg.err{background:var(--pink)}
.msg p+p,.msg ul+p,.msg p+ul{margin-top:8px}
.msg ul{margin:6px 0 0;padding-left:18px}
.composer{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-top:8px}
.composer textarea{min-height:52px;max-height:140px;resize:none;border-radius:18px}
.composer .btn{min-width:56px;padding:0 14px}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent-2);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}

/* onboarding */
.ob-prog{height:6px;background:var(--surface2);border-radius:3px;margin:10px 0 22px;overflow:hidden}
.ob-prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ob-q{font-family:var(--serif);font-size:1.75rem;line-height:1.15;margin-bottom:8px}
.ob-foot{display:flex;gap:10px;margin-top:26px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;margin-top:10px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:40px auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:80;max-width:90%;text-align:center}
details.why summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;min-height:44px;display:flex;align-items:center}
details.why summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="rest" class="rest" hidden></div>
<nav id="nav" class="nav" hidden aria-label="Navegação principal"><div class="nav-in" id="navIn"></div></nav>
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="backdrop" data-a="closeSheet"></div>
  <div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet"></div></div>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
'use strict';
/* ================= DADOS DE REFERÊNCIA ================= */
const MUS={gluteos:'Glúteos',gluteo_medio:'Glúteo médio',quadriceps:'Quadríceps',posteriores:'Posteriores de coxa',adutores:'Adutores',panturrilhas:'Panturrilhas',peito:'Peito',costas:'Costas',ombros:'Ombros',biceps:'Bíceps',triceps:'Tríceps',abdomen:'Abdômen'};
const EQ={barra:'Barra',maquina:'Máquina',halter:'Halteres',cabo:'Polia',elastico:'Elástico',corpo:'Peso corporal'};
const LOWER=['gluteos','gluteo_medio','quadriceps','posteriores','adutores','panturrilhas'];
const UPPER=['peito','costas','ombros','biceps','triceps'];
const regionOf=id=>{const p=LIB[id]?LIB[id].p:'';return LOWER.includes(p)?'inf':UPPER.includes(p)?'sup':'core'};
function dayType(ex){let i=0,s=0;ex.forEach(e=>{const r=regionOf(e.id);if(r==='inf')i++;else if(r==='sup')s++});return i>=s?'inf':'sup'}
function isMixed(ex){return new Set(ex.map(e=>regionOf(e.id)).filter(r=>r!=='core')).size>1}
const GROUPS=[['todos','Todos',null],['glu','Glúteos',['gluteos','gluteo_medio']],['quad','Quadríceps',['quadriceps']],['post','Posteriores',['posteriores']],['adu','Adutores',['adutores']],['pant','Panturrilhas',['panturrilhas']],['sup','Superiores',['peito','costas','ombros','biceps','triceps']],['core','Core',['abdomen']]];
const RPE=[['Fácil',6],['Moderado',7.5],['Difícil',9],['No limite',10]];
const OBJ={glu:'Ganhar massa e definir, com foco em glúteos e coxas',def:'Priorizar definição (reduzir gordura)',mas:'Priorizar ganho de massa'};
const NIVEL={iniciante:'Iniciante',intermediaria:'Intermediária',avancada:'Avançada'};

const LIB_ARR=[
{id:'hip_thrust',n:'Elevação pélvica com barra',p:'gluteos',s:['posteriores','adutores'],eq:'barra',k:'comp',r:[8,12],rest:120,
 i:['Apoie a parte de baixo das escápulas no banco, com a barra sobre o quadril (use proteção).','Pés na largura do quadril; no topo, as canelas ficam quase verticais.','Empurre pelos calcanhares e suba até quadril, tronco e joelhos ficarem alinhados.','Contraia os glúteos 1 s no topo, queixo levemente recolhido, e desça controlando.'],
 e:['Hiperestender a lombar no topo em vez de contrair o glúteo','Pés longe demais (vira posterior de coxa) ou perto demais (vira quadríceps)','Descer rápido, sem controle']},
{id:'hip_thrust_maq',n:'Elevação pélvica na máquina',p:'gluteos',s:['posteriores'],eq:'maquina',k:'comp',r:[10,12],rest:90,
 i:['Ajuste a almofada sobre o quadril, abaixo da crista ilíaca.','Pés firmes e joelhos a cerca de 90° no topo.','Suba empurrando pelos calcanhares e contraia os glúteos no alto.','Desça devagar até perto do fim do curso sem perder a tensão.'],
 e:['Arquear a lombar para subir mais','Tirar os calcanhares do apoio','Amplitude curta demais']},
{id:'glute_bridge_halter',n:'Ponte de glúteo com halter',p:'gluteos',s:['posteriores'],eq:'halter',k:'iso',r:[12,15],rest:60,
 i:['Deitada no chão, joelhos flexionados e halter apoiado sobre o quadril.','Pés na largura do quadril, calcanhares perto do glúteo.','Suba o quadril contraindo os glúteos e segure 1–2 s.','Desça sem relaxar totalmente e repita.'],
 e:['Empurrar com a ponta dos pés','Subir usando a lombar','Soltar o abdômen']},

const agoTxt=n=>n<=0?'hoje':n===1?'ontem':`há ${n} dias`;

function eqOk(ex,prof){const E=(prof&&prof.equip)||['completa'];if(E.includes('completa'))return true;return ex.eq==='corpo'||E.includes(ex.eq)}

function pick(c,used,prof){const ok=c.filter(id=>allowed(id,prof)&&!used.has(id));if(!ok.length)return null;return ok.find(id=>(prof.gosta||[]).includes(id))||ok[0]}
function exSec(e){const L=LIB[e.id];const w=L.unit==='s'?(e.repMax+10):45;return e.sets*((L.uni?2:1)*w+e.rest)+60}

function fitTime(list,target){
 const ex=list.map(e=>({...e}));
 const isGl=e=>['gluteos','gluteo_medio'].includes(LIB[e.id].p);
 const prot=(e,i)=>i<2||(LIB[e.id].k==='comp'&&LOWER.includes(LIB[e.id].p));
 let g=0;
 while(estMin(ex)>target&&g++<80){
  const rev=[...ex.keys()].reverse();
  let i=rev.find(i=>LIB[ex[i].id].k==='iso'&&!isGl(ex[i])&&ex[i].sets>2);if(i!=null){ex[i].sets--;continue}
  i=rev.find(i=>ex[i].sets>3);if(i!=null){ex[i].sets--;continue}
  i=rev.find(i=>!prot(ex[i],i)&&!isGl(ex[i]));if(i!=null&&ex.length>4){ex.splice(i,1);continue}
  i=rev.find(i=>ex[i].sets>2);if(i!=null){ex[i].sets--;continue}
  i=rev.find(i=>!prot(ex[i],i));if(i!=null&&ex.length>3){ex.splice(i,1);continue}
  if(ex.length>3){ex.pop();continue}
  break;
 }
 return ex;
}

  t.slots.forEach(([c,s],j)=>{const id=pick(c,used,prof);if(!id)return;used.add(id);let sets=s;if(prof.nivel==='avancada'&&j===0&&LOWER.includes(LIB[id].p))sets++;ex.push(mkEx(id,sets,prof))});
  return {id:'d'+(i+1),nome:t.nome,tipo:t.tipo,ex:fitTime(ex,prof.tempo)}});

  4:'Dois dias só de inferiores e dois só de superiores, alternados, sem misturar no mesmo dia. Os dias de inferiores concentram o volume de glúteos (um com ênfase em glúteos e posteriores, outro em quadríceps e glúteos), e cada grupo descansa 48–72 h. Agenda sugerida: seg inferiores, ter superiores, qui inferiores, sex superiores.',

}
async function aiPlan(prof,signal,onProg){

 const prompt=`Você é uma treinadora de musculação experiente. Monte um programa semanal para esta aluna.

${lib}

{"divisao":"nome curto da divisão","justificativa":"2 a 4 frases em português explicando a escolha e sugerindo dias da semana","dias":[{"nome":"nome curto do treino","tipo":"inferiores ou superiores","exercicios":[{"id":"hip_thrust","series":4,"repMin":8,"repMax":12,"descanso":120}]}]}`;

function looseParse(t){try{const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<=a)return null;return JSON.parse(t.slice(a,b+1))}catch(e){return null}}

   const lo=L.unit==='s'?15:4,hi=L.unit==='s'?90:30;let a=cl(q.repMin??q.rep_min,lo,hi,L.r[0]),b=cl(q.repMax??q.rep_max,lo,hi,L.r[1]);if(b<a)[a,b]=[b,a];
   ex.push({id,sets:cl(q.series??q.sets,2,5,3),repMin:a,repMax:b,rest:cl(q.descanso??q.rest,30,180,L.rest)});fromAI++});

/* ================= HISTÓRICO E PROGRESSÃO ================= */
function hist(exId){const out=[];SESS.forEach(s=>{const e=s.ex.find(x=>x.id===exId);if(!e)return;const ok=e.sets.filter(t=>t.reps>0);if(!ok.length)return;const top=ok.reduce((a,b)=>((b.kg||0)>(a.kg||0)||((b.kg||0)===(a.kg||0)&&b.reps>a.reps))?b:a);out.push({d:s.date,kg:top.kg||0,reps:top.reps,sets:ok,rpe:e.rpe,target:e.t})});return out}
function prefillKg(exId){const s=S.sug[exId];if(s&&s.kg!=null)return s.kg;const h=hist(exId);return h.length?h[h.length-1].kg:null}
function progress(e){
 const L=LIB[e.id],t=e.t,sets=e.sets;const top=Math.max(...sets.map(s=>s.kg||0));
 const allTop=sets.length>=t.sets&&sets.every(s=>s.reps>=t.repMax);
 const low=sets.filter(s=>s.reps<t.repMin).length;
 const hard=e.rpe!=null&&e.rpe>=10, easy=e.rpe!=null&&e.rpe<=7.5;
 if(L.unit==='s')return allTop?{kg:null,tipo:'up',msg:`Segurou ${t.repMax} s em todas. Aumente 5–10 s por série.`}:{kg:null,tipo:'hold',msg:'Mantenha e busque +5 s por série.'};
 if(top===0)return allTop?{kg:null,tipo:'up',msg:'Topo da faixa em todas. Adicione carga ou uma variação mais difícil.'}:{kg:null,tipo:'hold',msg:'Mantenha e busque +1 rep por série.'};
 const inc=(L.k==='comp'&&LOWER.includes(L.p))?2.5:(L.k==='comp'?2:1);
 if(allTop&&!hard){const k=r05(top+inc);return {kg:k,tipo:'up',msg:`Fez ${t.repMax}+ reps em todas as séries. Suba para ${fmt(k)} kg.`}}
 if(allTop&&hard)return {kg:top,tipo:'hold',msg:`Topo da faixa, mas no limite. Repita ${fmt(top)} kg para consolidar.`};
 if(low>=2){const prev=hist(e.id).slice(-1)[0];const prevLow=prev&&prev.target&&prev.sets.filter(s=>s.reps<prev.target.repMin).length>=2;

  return {kg:top,tipo:'hold',msg:`Abaixo da faixa hoje. Mantenha ${fmt(top)} kg na próxima.`}}

}
function planIds(){const s=new Set();(S.plan?S.plan.days:[]).forEach(d=>d.ex.forEach(e=>s.add(e.id)));return [...s]}

/* ================= GRÁFICOS ================= */
function lineChart(pts,unit=''){
 if(pts.length<2)return `<p class="empty-chart">${pts.length?'Registre mais uma vez para ver a linha do tempo.':'Nenhum registro ainda.'}</p>`;
 const W=340,H=150,pl=8,pr=46,pt=14,pb=24;const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);const vmin=mn,vmax=mx;if(mn===mx){mn-=1;mx+=1}const pad=(mx-mn)*.15;mn-=pad;mx+=pad;
 const X=i=>pl+(W-pl-pr)*(i/(pts.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
 const line=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
 const area=`${X(0).toFixed(1)},${H-pb} ${line} ${X(pts.length-1).toFixed(1)},${H-pb}`;
 const showMin=Math.abs(Y(vmin)-Y(vmax))>14;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução de ${fmt(pts[0].y)} para ${fmt(pts[pts.length-1].y)}${unit}">
 <polygon points="${area}" style="fill:var(--accent-soft)"/>
 <polyline points="${line}" style="fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/>
 ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===pts.length-1?4.5:3}" style="fill:${i===pts.length-1?'var(--accent)':'var(--surface)'};stroke:var(--accent);stroke-width:2"/>`).join('')}
 <text x="${W-pr+8}" y="${Y(vmax)+4}" class="ct">${fmt(vmax)}${unit}</text>
 ${showMin?`<text x="${W-pr+8}" y="${Y(vmin)+4}" class="ct">${fmt(vmin)}${unit}</text>`:''}
 <text x="${pl}" y="${H-6}" class="ct">${fdate(pts[0].x)}</text>
 <text x="${W-pr}" y="${H-6}" class="ct" text-anchor="end">${fdate(pts[pts.length-1].x)}</text></svg>`;
}
function barChart(arr,target){
 const W=340,H=130,pt=10,pb=22,n=arr.length,gap=8,bw=(W-gap*(n-1))/n;const mx=Math.max(target,...arr.map(a=>a.c),1);const Y=v=>pt+(H-pt-pb)*(1-v/mx);
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Treinos por semana">
 <line x1="0" x2="${W}" y1="${Y(target)}" y2="${Y(target)}" style="stroke:var(--pink-strong);stroke-width:1.5;stroke-dasharray:4 4"/>
 ${arr.map((a,i)=>{const x=i*(bw+gap),h=Math.max(3,(H-pt-pb)-(Y(a.c)-pt));return `<rect x="${x}" y="${H-pb-h}" width="${bw}" height="${h}" rx="6" style="fill:${a.c>=target?'var(--accent)':'var(--accent-2)'};opacity:${a.c?1:.35}"/><text x="${x+bw/2}" y="${H-pb-h-4}" class="ct" text-anchor="middle">${a.c||''}</text><text x="${x+bw/2}" y="${H-6}" class="ct" text-anchor="middle">${fdate(a.ws)}</text>`}).join('')}</svg>`;
}
function muscleMap(prim=[],sec=[],cls=''){
 const P=new Set(prim),Q=new Set(sec.filter(m=>!P.has(m)));
 const f=m=>P.has(m)?'var(--accent)':Q.has(m)?'var(--pink-strong)':'transparent';
 const b='var(--surface2)';const R=(x,y,w,h,rx,fill)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" style="fill:${fill}"/>`;
 const fig=cx=>`<circle cx="${cx}" cy="16" r="10" style="fill:${b}"/>${R(cx-4,25,8,8,2,b)}${R(cx-20,31,40,58,13,b)}${R(cx-31,35,9,54,4.5,b)}${R(cx+22,35,9,54,4.5,b)}${R(cx-20,82,40,24,10,b)}${R(cx-19,100,17,90,8,b)}${R(cx+2,100,17,90,8,b)}`;
 const pair=(cx,dx,cy,rx,ry,m)=>`<ellipse cx="${cx-dx}" cy="${cy}" rx="${rx}" ry="${ry}" style="fill:${f(m)}"/><ellipse cx="${cx+dx}" cy="${cy}" rx="${rx}" ry="${ry}" style="fill:${f(m)}"/>`;
 const F=55,B=165;
 return `<svg class="mmap ${cls}" viewBox="0 0 220 206" role="img" aria-label="Músculos trabalhados: ${esc([...P].map(m=>MUS[m]).join(', '))}">${fig(F)}${fig(B)}
 ${pair(F,24,41,7,7,'ombros')}${pair(F,8.5,47,9,7,'peito')}${pair(F,26.5,58,3.8,9,'biceps')}${R(F-8,58,16,28,6,f('abdomen'))}${pair(F,10.5,130,7,22,'quadriceps')}${pair(F,3.5,116,2.6,11,'adutores')}
 ${pair(B,24,41,7,7,'ombros')}${R(B-16,40,32,36,10,f('costas'))}${pair(B,26.5,58,3.8,9,'triceps')}${pair(B,15,89,5.5,6,'gluteo_medio')}${pair(B,9,100,9.5,9.5,'gluteos')}${pair(B,10.5,134,7,19,'posteriores')}${pair(B,10.5,168,5.8,13,'panturrilhas')}
 <text x="${F}" y="203" text-anchor="middle" class="mm-l">frente</text><text x="${B}" y="203" text-anchor="middle" class="mm-l">costas</text></svg>`;
}

const RULES=`Você é a assistente de treino dentro do aplicativo pessoal de musculação da usuária. Responda em português do Brasil, de forma direta e acolhedora, em no máximo ~130 palavras (mais só se ela pedir detalhes). Use os DADOS abaixo e cite números reais dela quando útil.
Prioridades: facilidade no treino, progressão de cargas, hipertrofia com definição, foco em glúteos e coxas sem negligenciar o resto do corpo.
Regra fixa do plano: cada dia é só de superiores ou só de inferiores. Nunca sugira colocar exercício de superiores em dia de inferiores ou o contrário (abdômen pode em qualquer dia).
Consistência: a rotina deve ser estável. Só proponha troca de exercício no plano quando houver motivo claro (pedido dela, desconforto relatado, equipamento indisponível, estagnação de 3+ treinos). Para propor, use a ferramenta propor_troca: ela cria um cartão que a usuária aprova; não diga que o plano já mudou.
Pouco tempo: mantenha os compostos de glúteos/pernas, reduza séries de isoladores e lembre que a tela Início tem versões de 45 e 30 min.
Execução: você não vê a usuária; descreva pontos de checagem objetivos e sugira gravar um vídeo de lado para comparar.
Estagnação: analise faixa de repetições, dificuldade relatada, frequência, sono/alimentação de forma geral, e sugira um ajuste concreto.
Segurança: você não diagnostica lesões ou doenças. Se ela relatar dor, oriente interromper o exercício que dói e procurar profissional de educação física ou médico. Em respostas sobre dor, lesão ou mudança de programa, lembre em uma frase que são orientações e não substituem avaliação profissional.`;
function ctxText(){const p=S.profile,L=[];
 L.push(`Hoje: ${dstr()}.`);
 L.push(`Perfil: ${p.idade} anos, ${p.altura} cm, peso inicial ${p.peso} kg, nível ${NIVEL[p.nivel]}, objetivo: ${OBJ[p.objetivo]}. ${p.dias} treinos/semana, até ${p.tempo} min. Equipamentos: ${p.equip.join(', ')}. Limitações relatadas: ${p.limit||'nenhuma'}. Favoritos: ${p.gosta.map(i=>LIB[i].n).join(', ')||'-'}. Evita: ${p.evita.map(i=>LIB[i].n).join(', ')||'-'}.`);
 L.push(`Plano atual (${S.plan.divisao}):`);S.plan.days.forEach(d=>L.push(`- dia_id=${d.id} "${d.nome}" ~${estMin(d.ex)}min: `+d.ex.map(e=>`${e.id} ${e.sets}x${e.repMin}-${e.repMax} desc${e.rest}s`).join('; ')));
 L.push(`Próximo treino: ${S.plan.days[S.nextDay%S.plan.days.length].nome}.`);
 if(S.active)L.push(`Treino em andamento agora: ${S.active.dayName}, exercício atual ${LIB[S.active.ex[S.active.idx].id].n}.`);
 L.push(`Treinos por semana nas últimas 6 semanas (mais antiga → atual): ${weeksSeries(6).map(w=>w.c).join(', ')}.`);
 const last=SESS.slice(-8);L.push(last.length?'Últimos treinos (kg x reps; rpe 6=fácil,7.5=moderado,9=difícil,10=no limite):':'Ainda não há treinos registrados.');
 last.forEach(s=>L.push(`- ${s.date} ${s.dayName} ${s.dur}min: `+s.ex.map(e=>`${e.id} ${e.sets.map(x=>`${x.kg}x${x.reps}`).join(',')}${e.rpe?` rpe${e.rpe}`:''}${e.note?` obs:"${e.note.slice(0,80)}"`:''}`).join(' | ')));
 const prog=planIds().map(id=>{const h=hist(id);return h.length>=2?`${id}: ${h[0].kg}kg x${h[0].reps} (${h[0].d}) → ${h[h.length-1].kg}kg x${h[h.length-1].reps} (${h[h.length-1].d}), ${h.length} sessões`:null}).filter(Boolean);
 if(prog.length)L.push('Evolução de cargas: '+prog.join('; '));
 const st=stagnant();if(st.length)L.push('Estagnados há 4 treinos: '+st.join(', '));
 const w=S.body.peso;if(w.length)L.push(`Peso corporal: ${w[0].kg}kg (${w[0].d}) → ${w[w.length-1].kg}kg (${w[w.length-1].d}).`);
 const m=S.body.medidas;if(m.length)L.push(`Medidas mais recentes (${m[m.length-1].d}): `+JSON.stringify(m[m.length-1]));
 L.push('Biblioteca disponível para trocas (id|nome|músculo|equipamento):');LIB_ARR.filter(x=>allowed(x.id)).forEach(x=>L.push(`${x.id}|${x.n}|${x.p}|${x.eq}`));
 return L.join('\n');}
const TOOL={name:'propor_troca',description:'Cria uma sugestão, pendente de aprovação da usuária, para substituir um exercício do plano por outro da biblioteca.',
 inputSchema:{type:'object',properties:{dia_id:{type:'string',description:'id do dia, ex. d1'},atual_id:{type:'string'},novo_id:{type:'string'},motivo:{type:'string',description:'1 frase curta'}},required:['dia_id','atual_id','novo_id','motivo']},
 execute(inp){const d=S.plan.days.find(x=>x.id===inp.dia_id);if(!d)throw new Error('dia_id inexistente');if(!d.ex.some(e=>e.id===inp.atual_id))throw new Error('atual_id não está nesse dia');if(!allowed(inp.novo_id))throw new Error('novo_id inválido ou indisponível');if(d.ex.some(e=>e.id===inp.novo_id))throw new Error('novo_id já está nesse dia');{const r=regionOf(inp.novo_id);if(r!=='core'&&r!==dayType(d.ex))throw new Error('não misture superiores e inferiores no mesmo dia')}
  S.sugestoes.push({id:nid(),dia:inp.dia_id,atual:inp.atual_id,novo:inp.novo_id,motivo:String(inp.motivo||'').slice(0,200)});return {ok:true,info:'Cartão criado para ela aprovar.'}}};
function errCopy(c){return c==='bad_key'?'A chave da API foi recusada. Confira em Ajustes.':c==='sem_credito'?'A conta da API está sem crédito.':c==='network'?'Sem internet no momento.':c==='not_granted'?'O uso da IA não foi autorizado nesta sessão. Recarregue o app para permitir.':c==='rate_limited'?'Muitas perguntas seguidas. Aguarde um minuto e tente de novo.':'Não consegui responder agora. Tente de novo em instantes.'}
async function sendChat(text){
 text=(text||'').trim();if(!text||UI.chatBusy)return;
 const prior=S.chat.slice();S.chat.push({r:'user',t:text});const msg={r:'assistant',t:'',pending:true};S.chat.push(msg);UI.chatBusy=true;UI.scrollChat=true;render();
 const sm=SAMPLE;
 if(!sm){msg.t='Cadastre sua chave da API em Ajustes para usar a assistente.';msg.err=true;msg.pending=false;UI.chatBusy=false;saveState();render();return}
 const turns=[{role:'user',content:RULES+'\n\nDADOS ATUAIS:\n'+ctxText()},{role:'assistant',content:'Entendido. Vou usar esses dados.'}];
 const pairs=[];for(let i=0;i<prior.length-1;i++){if(prior[i].r==='user'&&prior[i+1].r==='assistant'&&!prior[i+1].err&&prior[i+1].t){pairs.push({role:'user',content:prior[i].t},{role:'assistant',content:prior[i+1].t});i++}}
 turns.push(...pairs.slice(-16),{role:'user',content:text});
 UI.ctl=new AbortController();
 try{const r=await sm(turns,{cache:false,signal:UI.ctl.signal,tools:[TOOL],onText:({text})=>{msg.t=text;const el=document.getElementById('streaming');if(el)el.innerHTML=md(text)}});msg.t=r.text}
 catch(e){msg.t=(e&&e.text)||msg.t||'';if(!e||e.code!=='cancelled'){msg.t=(msg.t?msg.t+'\n\n':'')+errCopy(e&&e.code);msg.err=!(e&&e.text)}else if(!msg.t){msg.t='(interrompido)';msg.err=true}}
 msg.pending=false;UI.chatBusy=false;S.chat=S.chat.slice(-30);saveState();UI.scrollChat=true;render();
}

async function compress(file){
 let bmp;try{bmp=await createImageBitmap(file)}catch(e){bmp=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
 const go=(max,q)=>{const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)};
 let u=go(900,.74);if(u.length>230000)u=go(720,.6);if(u.length>230000)u=go(560,.55);return u;
}

const fdFull=s=>{const p=String(s).split('-');return `${p[2]}/${p[1]}/${p[0]}`};
function csvHist(){
 const q=v=>{v=v==null?'':String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const rows=[['Data','Treino','Exercício','Grupo muscular','Série','Carga (kg)','Repetições','Dificuldade','Observação']];
 SESS.forEach(s=>s.ex.forEach(e=>e.sets.forEach((t,j)=>rows.push([fdFull(s.date),s.dayName,LIB[e.id]?LIB[e.id].n:e.id,LIB[e.id]?MUS[LIB[e.id].p]:'',j+1,fmt(t.kg),t.reps,j===0?((RPE.find(r=>r[1]===e.rpe)||[''])[0]):'',j===0?(e.note||''):'']))));
 if(S.body.peso.length){rows.push([]);rows.push(['Data','Peso corporal (kg)']);S.body.peso.forEach(w=>rows.push([fdFull(w.d),fmt(w.kg)]))}
 if(S.body.medidas.length){rows.push([]);rows.push(['Data','Cintura','Abdômen','Quadril','Coxa','Braço']);S.body.medidas.forEach(m=>rows.push([fdFull(m.d),fmt(m.cintura),fmt(m.abdomen),fmt(m.quadril),fmt(m.coxa),fmt(m.braco)].map(v=>v==='—'?'':v)))}
 return '\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}
async function saveFile(filename,data){
 const type=filename.endsWith('.csv')?'text/csv':'application/json';const blob=new Blob([data],{type});
 try{const file=new File([blob],filename,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return}}
 catch(e){if(e&&e.name==='AbortError')return}
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},2000);toast('Arquivo salvo em Downloads');
}
function restoreAsk(file){
 const fr=new FileReader();
 fr.onload=()=>{let o;try{o=JSON.parse(fr.result)}catch(e){return toast('Esse arquivo não é um backup válido')}
  if(!o||o.app!=='meu-diario-de-treino'||!o.S||!o.S.plan)return toast('Esse arquivo não é um backup do app');
  UI.restore=o;const n=(o.SESS||[]).length,f=(o.PHOTOS||[]).length;
  openSheet(`<h2>Restaurar backup?</h2><p class="muted">Backup de ${o.exportado?fdFull(o.exportado.slice(0,10)):'data desconhecida'}, com ${n} treino(s) e ${f} foto(s).</p><p class="small" style="margin-top:10px">Perfil, plano, medidas e peso serão substituídos pelos do backup. Treinos e fotos serão somados aos atuais, sem duplicar.</p><button class="btn primary big block" style="margin-top:18px" data-a="restoreOk">Restaurar</button><button class="btn block" style="margin-top:8px" data-a="closeSheet">Cancelar</button>`)};
 fr.onerror=()=>toast('Não foi possível ler o arquivo');fr.readAsText(file);
}

 clearChat:()=>{S.chat=[];saveState();render()},
 applySug:t=>{const s=S.sugestoes.find(x=>x.id===t.dataset.id);S.sugestoes=S.sugestoes.filter(x=>x.id!==s.id);const d=S.plan.days.find(x=>x.id===s.dia);const i=d?d.ex.findIndex(e=>e.id===s.atual):-1;
  if(i<0){saveState();render();return toast('Esse exercício não está mais no plano')}const L=LIB[s.novo];d.ex[i]={id:s.novo,sets:d.ex[i].sets,repMin:L.r[0],repMax:L.r[1],rest:L.rest};saveState();render();toast('Plano atualizado')},
 dropSug:t=>{S.sugestoes=S.sugestoes.filter(x=>x.id!==t.dataset.id);saveState();render()},
 editProfile:()=>{closeSheet();obInit(S.profile);UI.ob=true;render();window.scrollTo(0,0)},
 saveKey:()=>{const v=$('#keyIn').value.trim();if(!/^sk-ant-/.test(v))return toast('A chave começa com sk-ant-');try{localStorage.setItem(KEY_LS,v)}catch(e){return toast('Não foi possível salvar a chave')}refreshSampler();settingsSheet();toast('Chave salva')},
 delKey:()=>{try{localStorage.removeItem(KEY_LS)}catch(e){}refreshSampler();settingsSheet();toast('Chave removida')},
 expCsv:()=>{if(!SESS.length&&!S.body.peso.length)return toast('Ainda não há treinos para exportar');saveFile(`treinos-${dstr()}.csv`,csvHist())},
 expJson:()=>saveFile(`backup-treino-${dstr()}.json`,JSON.stringify({app:'meu-diario-de-treino',versao:1,exportado:new Date().toISOString(),S,SESS,PHOTOS})),
 restoreOk:()=>{const o=UI.restore;UI.restore=null;if(!o)return closeSheet();OB=null;UI.ob=false;
  const keepActive=S.active;S=Object.assign(defaultState(),JSON.parse(JSON.stringify(o.S)));S.active=keepActive||null;S.chat=(S.chat||[]).filter(m=>!m.pending);
  (o.SESS||[]).forEach(s=>{if(s&&s.id&&!SESS.some(x=>x.id===s.id))Store.addSession(s)});SESS.sort((a,b)=>a.start-b.start);
  (o.PHOTOS||[]).forEach(ph=>{if(ph&&ph.id&&!PHOTOS.some(x=>x.id===ph.id))Store.addPhoto(ph)});
  saveState();closeSheet();UI.tab='inicio';render();toast('Backup restaurado')},
 wipeAsk:()=>openSheet(`<h2>Apagar tudo?</h2><p class="muted">Perfil, plano, histórico, medidas e fotos serão apagados. Não dá para desfazer.</p><button class="btn danger block" style="margin-top:18px" data-a="wipeOk">Apagar definitivamente</button><button class="btn block" style="margin-top:8px" data-a="closeSheet">Cancelar</button>`),
 wipeOk:async()=>{closeSheet();await Store.wipe();OB=null;UI.ob=false;UI.tab='inicio';render();toast('Dados apagados')},
 obSet:t=>{OB.d[t.dataset.k]=t.dataset.num?+t.dataset.v:t.dataset.v;render()},
 obEquip:t=>{const k=t.dataset.k,e=OB.d.equip;if(k==='completa')OB.d.equip=['completa'];else{let n=e.filter(x=>x!=='completa');n=n.includes(k)?n.filter(x=>x!==k):[...n,k];OB.d.equip=n.length?n:['completa']}render()},
 obLike:t=>{const id=t.dataset.id,d=OB.d;if(d.gosta.includes(id)){d.gosta=d.gosta.filter(x=>x!==id);d.evita.push(id)}else if(d.evita.includes(id)){d.evita=d.evita.filter(x=>x!==id)}else d.gosta.push(id);render()},
 obBack:()=>{OB.step=Math.max(0,OB.step-1);render()},
 obCancel:()=>{UI.ob=false;OB=null;render()},
 obNext:()=>{const d=OB.d;
  if(OB.step===1){const i=num(d.idade),a=num(d.altura),p=num(d.peso);if(!(i>=14&&i<=90)||!(a>=120&&a<=220)||!(p>=30&&p<=250)){$('#obErr').textContent='Confira idade, altura (em cm) e peso (em kg).';return}d.idade=i;d.altura=a;d.peso=p}
  if(OB.step===4){d.gosta=d.gosta.filter(id=>eqOk(LIB[id],d));d.evita=d.evita.filter(id=>eqOk(LIB[id],d))}
  if(OB.step===5){OB.skipped=false;obGenerate();return}
  OB.step++;render();window.scrollTo(0,0)},
 obSkipAI:()=>{OB.skipped=true;OB.ctl&&OB.ctl.abort();OB.plan=buildFallbackPlan(OB.d);OB.step=7;render()},
 obRegen:()=>{obGenerate()},
 retryAI:()=>{closeSheet();obInit(S.profile);UI.ob=true;obGenerate();window.scrollTo(0,0)},
 obAccept:()=>{const d=OB.d;S.profile=d;S.plan=OB.plan;S.nextDay=0;S.sugestoes=[];if(!S.body.peso.length&&d.peso)S.body.peso.push({d:dstr(),kg:d.peso});
  if(S.active){const ok=S.plan.days.some(x=>x.id===S.active.dayId);if(!ok)S.active=null}
  saveState();OB=null;UI.ob=false;UI.tab='inicio';render();window.scrollTo(0,0)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('input',e=>{const t=e.target;const k=t.dataset&&t.dataset.in;if(!k)return;
 if(k==='ob')OB.d[t.dataset.k]=t.value;
 else if(k==='set'){const s=S.active.ex[S.active.idx].sets[+t.dataset.j];s[t.dataset.f]=t.value===''?null:num(t.value);saveState()}
 else if(k==='exNote'){S.active.ex[S.active.idx].note=t.value.slice(0,300);saveState()}
 else if(k==='noteEx'){S.notes[t.dataset.id]=t.value.slice(0,500);saveState()}
 else if(k==='exQ'){UI.exQ=t.value;const pos=t.selectionStart;render();const n=$('#exQ');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
});
document.addEventListener('keydown',e=>{if(e.target.id==='chatIn'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat(e.target.value)}if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet()});
document.addEventListener('change',async e=>{if(e.target.id==='restoreIn'&&e.target.files[0]){restoreAsk(e.target.files[0]);e.target.value='';return}
 if(e.target.id!=='photoIn'||!e.target.files[0])return;const f=e.target.files[0];toast('Salvando foto…');
 try{const src=await compress(f);Store.addPhoto({id:nid(),d:dstr(),pose:UI.poseNew,src});render();toast('Foto salva')}catch(err){toast('Não foi possível ler essa imagem')}});

/* ================= INÍCIO ================= */
Store.loadLocal();
S.chat=(S.chat||[]).filter(m=>!m.pending);
render();
PhotoDB.all().then(a=>{PHOTOS=(a||[]).sort((x,y)=>x.d<y.d?-1:1);if(UI.tab==='evolucao')render()}).catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
